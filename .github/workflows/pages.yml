# Publica OjoFino en GitHub Pages. Solo se publica si todas las pruebas pasan,
# y solo los archivos de la app (no las pruebas, herramientas ni documentos).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Pruebas y armado del sitio. Solo si todo pasa se sube el paquete.
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar herramientas de prueba
        run: npm ci

      - name: Pruebas
        run: npm test

      - name: Verificar que sw.js está al día
        run: |
          node tools/generar-sw.mjs
          git diff --exit-code sw.js || (echo "::error::sw.js no está al día: ejecuta 'npm run sw' y haz commit" && exit 1)

      - name: Preparar sitio
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest sw.js icons src vendor dict _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 2) Publicación en un job aparte, como recomienda actions/deploy-pages:
  #    en el mismo job el paquete recién subido a veces aún no aparece.
  publicar:
    needs: probar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
