<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'">
  <title>OjoFino</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>OjoFino</h1>
    <p>Revisión de ortografía y gramática en PDF. Todo se procesa en este dispositivo.</p>
  </header>
  <main>
    <label class="boton">
      Elegir PDF
      <input id="archivo" type="file" accept="application/pdf" disabled>
    </label>
    <p id="estado" role="status">Cargando diccionario…</p>
    <p id="resumen"></p>
    <div id="acciones" hidden>
      <button type="button" id="ver-informe" class="boton">Ver informe</button>
      <button type="button" id="guardar-informe" class="boton secundario">Guardar informe PDF</button>
    </div>
    <div class="tabla">
      <table id="resultados">
        <thead>
          <tr><th>Pág.</th><th>Palabra</th><th>Tipo</th><th>Motivo</th><th>Contexto</th><th>Sugerencia (referencia)</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
