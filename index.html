<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.ts.net http://localhost:* http://127.0.0.1:*">
  <meta name="theme-color" content="#2f5d50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OjoFino">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>OjoFino</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="aviso-version" class="aviso-version" role="status" hidden>
    <span>Hay una versión nueva de OjoFino.</span>
    <button type="button" class="mini">Actualizar</button>
  </div>
  <header>
    <div class="cabecera">
      <h1>OjoFino</h1>
      <button type="button" id="abrir-ajustes" class="boton secundario">Mis ajustes</button>
    </div>
    <p>Revisión de ortografía y gramática en PDF. Todo se procesa en este dispositivo.</p>
  </header>
  <main>
    <label class="boton">
      Elegir PDF
      <input id="archivo" type="file" accept="application/pdf" disabled>
    </label>
    <p id="estado" role="status">Cargando diccionario…</p>
    <p id="resumen"></p>
    <div id="acciones" hidden>
      <button type="button" id="ver-informe" class="boton">Ver informe</button>
      <button type="button" id="guardar-informe" class="boton secundario">Guardar informe PDF</button>
    </div>
    <div class="tabla">
      <table id="resultados">
        <thead>
          <tr><th>Pág.</th><th>Palabra</th><th>Tipo</th><th>Motivo</th><th>Contexto</th><th>Sugerencia (referencia)</th><th><span class="oculto">Acciones</span></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <details id="ignoradas" hidden>
      <summary>Ignoradas (<span id="n-ignoradas">0</span>)</summary>
      <div class="tabla">
        <table id="tabla-ignoradas">
          <thead><tr><th>Pág.</th><th>Palabra</th><th>Tipo</th><th>Motivo</th><th>Ignorada</th><th><span class="oculto">Acciones</span></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </details>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
